<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@700&family=Public+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0}
  body{width:1200px;height:900px;overflow:hidden;background:#0F332D;font-family:'Public Sans',sans-serif;position:relative}
  .foto{position:absolute;inset:0;width:1200px;height:900px;object-fit:cover;object-position:var(--pos,center)}
  .fascia{position:absolute;left:0;right:0;bottom:0;background:#1B4B43;color:#fff;padding:40px 64px 48px;box-shadow:0 -12px 40px rgba(15,51,45,.35)}
  .occhiello{font-family:'IBM Plex Mono',monospace;font-size:24px;letter-spacing:.08em;text-transform:uppercase;color:#DB9200;margin:0 0 14px}
  h1{font-family:'Zilla Slab',serif;font-weight:700;font-size:var(--h,64px);line-height:1.12;margin:0}
  .logo{position:absolute;top:36px;left:64px;background:rgba(251,248,241,.94);color:#0F332D;font-family:'Zilla Slab',serif;font-weight:700;font-size:26px;padding:12px 22px;border-radius:999px}
  .solo{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 96px;background:linear-gradient(135deg,#0F332D,#1B4B43)}
  .solo .occhiello{font-size:28px;margin-bottom:28px}
  .solo h1{font-size:var(--h,76px);color:#fff}
  .pie{display:flex;justify-content:space-between;margin-top:30px;font-size:24px;color:#FBF8F1;opacity:.92}
  .solo .pie{position:absolute;left:96px;right:96px;bottom:48px;margin:0}
  .solo .testo{font-size:34px;line-height:1.4;color:#FBF8F1;margin-top:32px;max-width:980px}
</style></head>
