<!doctype html><html lang="it"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@600;700&family=Public+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:transparent}
  .q{width:720px;height:720px;background:#0F332D;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-family:'Zilla Slab',serif;color:#fff;position:relative;overflow:hidden}
  .q.crema{background:#FBF8F1;color:#0F332D}
  .v{font-weight:700;font-size:300px;line-height:.78;color:#DB9200;letter-spacing:-0.04em;font-family:'Zilla Slab',serif;margin-top:-20px}
  .q .nome{font-weight:700;font-size:92px;line-height:1;margin-top:28px;letter-spacing:-0.01em}
  .q .sotto{font-family:'Public Sans',sans-serif;font-weight:600;font-size:24px;letter-spacing:.22em;text-transform:uppercase;color:#DB9200;margin-top:22px}
  .q.crema .sotto{color:#8F5E00}
  .o{width:1400px;height:420px;display:flex;align-items:center;gap:40px;padding:0 60px;box-sizing:border-box;font-family:'Zilla Slab',serif;color:#0F332D;background:transparent}
  .o.verde{background:#0F332D;color:#fff}
  .o .mark{width:300px;height:300px;border-radius:64px;background:#0F332D;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .o.verde .mark{background:#1B4B43}
  .o .mark .v{font-size:230px;margin-top:-8px}
  .o .testi .nome{font-weight:700;font-size:150px;line-height:.95;letter-spacing:-0.015em}
  .o .testi .sotto{font-family:'Public Sans',sans-serif;font-weight:600;font-size:30px;letter-spacing:.16em;white-space:nowrap;text-transform:uppercase;color:#8F5E00;margin-top:22px}
  .o.verde .testi .sotto{color:#DB9200}
</style></head><body></body></html>
